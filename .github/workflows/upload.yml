name: Cloud Remote Uploader, Zipper & Video Studio

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Operation Mode: remote_upload, zip_folder, convert_video'
        required: false
        default: 'remote_upload'
      url:
        description: 'Remote Download URL, Magnet Link, or Video URLs (comma separated for merge)'
        required: false
      destination:
        description: 'Destination: gdrive or gphotos'
        required: false
        default: 'gdrive'
      folder:
        description: 'Target Folder / Source Folder / Album / Drive Video Path(s)'
        required: false
        default: 'Remote_Uploads'
      zip_name:
        description: 'Custom Output Name (Optional)'
        required: false
      zip_password:
        description: 'Optional Password'
        required: false
      video_preset:
        description: 'Video Preset: mp4_universal, compress_hevc, extract_mp3, to_720p, to_480p, add_watermark, merge_videos'
        required: false
        default: 'mp4_universal'
      watermark_text:
        description: 'Watermark Text to overlay'
        required: false
        default: ''
      watermark_pos:
        description: 'Watermark Position: bottom_right, top_right, top_left, bottom_left, center'
        required: false
        default: 'bottom_right'

jobs:
  process:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Install Aria2, Rclone, Zip, FFmpeg and Tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y aria2 curl wget zip p7zip-full ffmpeg fonts-freefont-ttf python3-pip
          pip3 install --break-system-packages gdown || pip3 install gdown || true
          curl https://rclone.org/install.sh | sudo bash

      - name: Configure Rclone
        env:
          RCLONE_B64: ${{ secrets.RCLONE_CONF_BASE64 }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_B64" | base64 -d > ~/.config/rclone/rclone.conf
          rclone listremotes

      - name: Execute Pipeline
        id: pipeline
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then MODE="remote_upload"; fi

          URL="${{ github.event.inputs.url }}"
          DEST="${{ github.event.inputs.destination }}"
          if [ -z "$DEST" ]; then DEST="gdrive"; fi

          FOLDER="${{ github.event.inputs.folder }}"
          if [ -z "$FOLDER" ]; then FOLDER="Remote_Uploads"; fi

          ZIP_NAME="${{ github.event.inputs.zip_name }}"
          ZIP_PASS="${{ github.event.inputs.zip_password }}"
          PRESET="${{ github.event.inputs.video_preset }}"
          if [ -z "$PRESET" ]; then PRESET="mp4_universal"; fi

          WM_TEXT="${{ github.event.inputs.watermark_text }}"
          WM_POS="${{ github.event.inputs.watermark_pos }}"
          if [ -z "$WM_POS" ]; then WM_POS="bottom_right"; fi

          mkdir -p ./downloads
          mkdir -p ./to_zip
          mkdir -p ./converted

          echo "==========================================="
          echo "Pipeline Mode: $MODE"
          echo "Destination: $DEST"
          echo "Folder / Param: $FOLDER"
          echo "Video Preset: $PRESET"
          echo "==========================================="

          if [ "$MODE" = "zip_folder" ]; then
            echo "🗜️ Starting Google Drive Folder ZIP Pipeline..."
            
            ORIGINAL_FOLDER_NAME=""
            if [[ "$URL" =~ drive\.google\.com ]]; then
              echo "Downloading Public Google Drive Folder: $URL"
              gdown --folder "$URL" -O ./to_zip/ || rclone copy --drive-shared-with-me "gdrive:" ./to_zip/ -P || true
              ORIGINAL_FOLDER_NAME="Public_Drive_Folder"
            else
              echo "Copying from your own Google Drive: gdrive:$FOLDER"
              rclone copy "gdrive:$FOLDER" ./to_zip/ -P
              ORIGINAL_FOLDER_NAME=$(basename "$FOLDER")
            fi

            # Auto-Naming with Suffix Collision Protection
            if [ -z "$ZIP_NAME" ]; then
              CLEAN_FOLDER_NAME=$(echo "$ORIGINAL_FOLDER_NAME" | tr -cd '[:alnum:]_-')
              if [ -z "$CLEAN_FOLDER_NAME" ]; then
                CLEAN_FOLDER_NAME="Drive_Archive"
              fi
              ZIP_NAME="${CLEAN_FOLDER_NAME}.zip"

              # Check if file with same name already exists in target destination
              EXISTS=$(rclone ls "gdrive:Remote_Uploads/$ZIP_NAME" 2>/dev/null | head -n 1)
              if [ ! -z "$EXISTS" ]; then
                TIMESTAMP_SUFFIX=$(date +'%Y%m%d_%H%M%S')
                ZIP_NAME="${CLEAN_FOLDER_NAME}_${TIMESTAMP_SUFFIX}.zip"
                echo "File exists! Auto-appended suffix: $ZIP_NAME"
              fi
            fi

            if [[ ! "$ZIP_NAME" =~ \.zip$ ]]; then
              ZIP_NAME="${ZIP_NAME}.zip"
            fi

            echo "Compressing into archive: $ZIP_NAME"
            if [ ! -z "$ZIP_PASS" ]; then
              echo "Applying password protection..."
              7z a -tzip -p"$ZIP_PASS" -mhe=on "./downloads/$ZIP_NAME" ./to_zip/*
            else
              cd ./to_zip
              zip -r -q "../downloads/$ZIP_NAME" .
              cd ..
            fi

            ITEM_NAME="$ZIP_NAME"
            TARGET_UPLOAD_FOLDER="Remote_Uploads"

          elif [ "$MODE" = "convert_video" ]; then
            echo "🎬 Starting Cloud Video Studio Engine (FFmpeg)..."
            
            if [ "$PRESET" = "merge_videos" ]; then
              echo "🔗 Processing Video Merge / Joiner..."
              mkdir -p ./merge_parts
              > concat_list.txt
              
              # Parse comma-separated inputs
              RAW_INPUT="$URL"
              if [ -z "$RAW_INPUT" ]; then RAW_INPUT="$FOLDER"; fi
              
              IFS=',' read -ra ADDR <<< "$RAW_INPUT"
              idx=1
              for item in "${ADDR[@]}"; do
                trimmed=$(echo "$item" | xargs)
                if [ ! -z "$trimmed" ]; then
                  part_file="./merge_parts/part_${idx}.mp4"
                  if [[ "$trimmed" =~ ^https?:// ]] || [[ "$trimmed" =~ ^magnet:\? ]]; then
                    echo "Downloading part $idx: $trimmed"
                    aria2c -x 8 -s 8 -d ./merge_parts -o "raw_${idx}" "$trimmed" || wget -O "$part_file" "$trimmed"
                  else
                    echo "Fetching part $idx from Google Drive: gdrive:$trimmed"
                    rclone copy "gdrive:$trimmed" ./merge_parts/ -P
                  fi
                  # Normalize to mp4
                  FOUND_PART=$(find ./merge_parts -type f -not -name "part_*.mp4" | head -n 1)
                  if [ ! -z "$FOUND_PART" ]; then
                    ffmpeg -i "$FOUND_PART" -vcodec libx264 -preset fast -acodec aac "$part_file" -y
                    rm -f "$FOUND_PART"
                  fi
                  if [ -f "$part_file" ]; then
                    echo "file '$(pwd)/$part_file'" >> concat_list.txt
                    idx=$((idx+1))
                  fi
                fi
              done

              OUT_FILE="./converted/Merged_Video_$(date +'%Y%m%d_%H%M%S').mp4"
              echo "Concatenating all video parts..."
              cat concat_list.txt
              ffmpeg -f concat -safe 0 -i concat_list.txt -c copy "$OUT_FILE" || ffmpeg -f concat -safe 0 -i concat_list.txt -vcodec libx264 -crf 21 -preset fast -acodec aac "$OUT_FILE"

            else
              # Fetch single source video
              if [ ! -z "$URL" ]; then
                if [[ "$URL" =~ ^magnet:\? ]] || [[ "$URL" =~ \.torrent($|\?) ]]; then
                  echo "Downloading Video from Torrent / Magnet..."
                  aria2c --enable-dht=true --bt-enable-lpd=true --bt-max-peers=120 --seed-time=0 --max-overall-upload-limit=1K --bt-stop-timeout=300 -d ./downloads "$URL"
                else
                  echo "Downloading Video from URL..."
                  aria2c -x 16 -s 16 -k 1M -d ./downloads "$URL" || wget -P ./downloads "$URL"
                fi
              else
                echo "Fetching Video from Google Drive: gdrive:$FOLDER"
                rclone copy "gdrive:$FOLDER" ./downloads/ -P
              fi

              SRC_VIDEO=$(find ./downloads -type f \( -name "*.mp4" -o -name "*.mkv" -o -name "*.avi" -o -name "*.mov" -o -name "*.webm" -o -name "*.flv" -o -name "*.ts" -o -name "*.m4v" \) | head -n 1)
              if [ -z "$SRC_VIDEO" ]; then
                SRC_VIDEO=$(ls -1 ./downloads | head -n 1)
                SRC_VIDEO="./downloads/$SRC_VIDEO"
              fi
              echo "Source Video File: $SRC_VIDEO"
              BASE_NAME=$(basename "$SRC_VIDEO" | sed 's/\.[^.]*$//')

              if [ "$PRESET" = "add_watermark" ]; then
                OUT_FILE="./converted/${BASE_NAME}_Watermarked.mp4"
                echo "Applying Video Watermark: '$WM_TEXT' at position: $WM_POS"
                
                # Position coordinates
                case "$WM_POS" in
                  "top_left") POS_XY="x=30:y=30" ;;
                  "top_right") POS_XY="x=w-tw-30:y=30" ;;
                  "bottom_left") POS_XY="x=30:y=h-th-30" ;;
                  "center") POS_XY="x=(w-tw)/2:y=(h-th)/2" ;;
                  *) POS_XY="x=w-tw-30:y=h-th-30" ;; # default bottom_right
                esac

                ffmpeg -i "$SRC_VIDEO" -vf "drawtext=text='$WM_TEXT':fontcolor=white@0.85:fontsize=28:box=1:boxcolor=black@0.45:boxborderw=6:$POS_XY" -vcodec libx264 -crf 20 -preset fast -acodec copy "$OUT_FILE"

              elif [ "$PRESET" = "extract_mp3" ]; then
                OUT_FILE="./converted/${BASE_NAME}_Audio.mp3"
                echo "Extracting MP3 Audio (320kbps)..."
                ffmpeg -i "$SRC_VIDEO" -vn -ar 44100 -ac 2 -b:a 320k "$OUT_FILE"

              elif [ "$PRESET" = "compress_hevc" ]; then
                OUT_FILE="./converted/${BASE_NAME}_Compressed.mp4"
                echo "Applying High-Efficiency HEVC/H.265 Video Compression..."
                ffmpeg -i "$SRC_VIDEO" -vcodec libx265 -crf 26 -preset fast -acodec aac -b:a 128k "$OUT_FILE"

              elif [ "$PRESET" = "to_720p" ]; then
                OUT_FILE="./converted/${BASE_NAME}_720p.mp4"
                echo "Scaling to 720p HD MP4..."
                ffmpeg -i "$SRC_VIDEO" -vf "scale=-2:720" -vcodec libx264 -crf 22 -preset fast -acodec aac -b:a 192k "$OUT_FILE"

              elif [ "$PRESET" = "to_480p" ]; then
                OUT_FILE="./converted/${BASE_NAME}_480p.mp4"
                echo "Scaling to 480p SD MP4..."
                ffmpeg -i "$SRC_VIDEO" -vf "scale=-2:480" -vcodec libx264 -crf 24 -preset fast -acodec aac -b:a 128k "$OUT_FILE"

              else
                OUT_FILE="./converted/${BASE_NAME}_Converted.mp4"
                echo "Converting to Universal MP4 (H.264/AAC)..."
                ffmpeg -i "$SRC_VIDEO" -vcodec libx264 -crf 21 -preset fast -acodec aac -b:a 192k "$OUT_FILE"
              fi
            fi

            rm -rf ./downloads/*
            mv "$OUT_FILE" ./downloads/
            ITEM_NAME=$(basename "$OUT_FILE")
            TARGET_UPLOAD_FOLDER="Converted_Videos"

          else
            echo "⚡ Starting Remote Download Pipeline..."
            if [[ "$URL" =~ ^magnet:\? ]] || [[ "$URL" =~ \.torrent($|\?) ]]; then
              echo "⚡ BitTorrent / Magnet Link detected!"
              aria2c --enable-dht=true --bt-enable-lpd=true --bt-max-peers=120 --seed-time=0 --max-overall-upload-limit=1K --bt-stop-timeout=300 --summary-interval=5 -d ./downloads "$URL"
            else
              echo "⚡ Direct HTTP/HTTPS/FTP URL detected!"
              if aria2c --async-dns=false -x 16 -s 16 -k 1M -j 4 --summary-interval=5 -d ./downloads "$URL"; then
                echo "Downloaded successfully with aria2c"
              else
                echo "aria2c fallback to curl/wget..."
                cd ./downloads
                curl -L -O -J "$URL" || wget -c "$URL"
                cd ..
              fi
            fi

            ITEM_NAME=$(ls -1 ./downloads | head -n 1)
            TARGET_UPLOAD_FOLDER="$FOLDER"
          fi

          if [ -z "$ITEM_NAME" ]; then
            echo "Error: No files found to upload!"
            exit 1
          fi

          echo "Final Item to upload: $ITEM_NAME"

          # Upload to Cloud
          if [ "$DEST" = "gphotos" ] && [ "$MODE" = "remote_upload" ]; then
            echo "Uploading to Google Photos Album: $TARGET_UPLOAD_FOLDER"
            rclone copy "./downloads" "gphotos:album/$TARGET_UPLOAD_FOLDER" -P || rclone copy "./downloads" "gphotos:upload" -P
            SHARE_LINK="https://photos.google.com/"
            DIRECT_LINK="https://photos.google.com/"
          else
            echo "Uploading to Google Drive Folder: $TARGET_UPLOAD_FOLDER"
            rclone copy "./downloads" "gdrive:$TARGET_UPLOAD_FOLDER" --drive-chunk-size 64M -P
            SHARE_LINK=$(rclone link "gdrive:$TARGET_UPLOAD_FOLDER/$ITEM_NAME")
            if [ -z "$SHARE_LINK" ]; then
              SHARE_LINK=$(rclone link "gdrive:$TARGET_UPLOAD_FOLDER")
            fi
            
            FILE_ID=$(echo "$SHARE_LINK" | sed -n 's/.*id=\([^&]*\).*/\1/p')
            if [ -z "$FILE_ID" ]; then
              FILE_ID=$(echo "$SHARE_LINK" | sed -n 's/.*\/d\/\([^/]*\).*/\1/p')
            fi
            
            if [ ! -z "$FILE_ID" ]; then
              DIRECT_LINK="https://drive.google.com/uc?id=$FILE_ID&export=download"
            else
              DIRECT_LINK="$SHARE_LINK"
            fi
          fi

          echo "PUBLIC_LINK=$SHARE_LINK"

          # GitHub Job Summary
          echo "## 🚀 Pipeline Completed Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "- **📁 Output File:** \`$ITEM_NAME\`" >> $GITHUB_STEP_SUMMARY
          echo "- **⚙️ Mode:** \`$MODE\`" >> $GITHUB_STEP_SUMMARY
          echo "- **📂 Target:** \`$TARGET_UPLOAD_FOLDER\`" >> $GITHUB_STEP_SUMMARY
          echo "- **🔗 Link:** [$SHARE_LINK]($SHARE_LINK)" >> $GITHUB_STEP_SUMMARY

          # Publish to result.json in repo
          cat <<EOF > result.json
          {
            "status": "success",
            "mode": "$MODE",
            "destination": "$DEST",
            "filename": "$ITEM_NAME",
            "folder": "$TARGET_UPLOAD_FOLDER",
            "share_link": "$SHARE_LINK",
            "direct_link": "$DIRECT_LINK",
            "timestamp": "$(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          }
          EOF

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add result.json
          git commit -m "Update result: $ITEM_NAME [skip ci]" || true
          git push origin main || true
