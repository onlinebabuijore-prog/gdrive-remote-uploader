name: Remote URL to Google Drive & Google Photos

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Remote Download URL or Magnet Link'
        required: true
      destination:
        description: 'Destination: gdrive or gphotos'
        required: false
        default: 'gdrive'
      folder:
        description: 'Google Drive Folder Name or Google Photos Album'
        required: false
        default: 'Remote_Uploads'

jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Install Aria2 and Rclone
        run: |
          sudo apt-get update -y
          sudo apt-get install -y aria2 curl wget
          curl https://rclone.org/install.sh | sudo bash

      - name: Configure Rclone
        env:
          RCLONE_B64: ${{ secrets.RCLONE_CONF_BASE64 }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_B64" | base64 -d > ~/.config/rclone/rclone.conf
          rclone listremotes

      - name: Download File, Torrent or Magnet from URL
        run: |
          mkdir -p ./downloads
          URL="${{ github.event.inputs.url }}"
          echo "Starting high-speed download for: $URL"
          
          # Check if URL is a Magnet link or Torrent file
          if [[ "$URL" =~ ^magnet:\? ]] || [[ "$URL" =~ \.torrent($|\?) ]]; then
            echo "⚡ BitTorrent / Magnet Link detected!"
            aria2c \
              --enable-dht=true \
              --bt-enable-lpd=true \
              --bt-max-peers=120 \
              --seed-time=0 \
              --max-overall-upload-limit=1K \
              --bt-stop-timeout=300 \
              --summary-interval=5 \
              -d ./downloads "$URL"
          else
            echo "⚡ Direct HTTP/HTTPS/FTP URL detected!"
            if aria2c --async-dns=false -x 16 -s 16 -k 1M -j 4 --summary-interval=5 -d ./downloads "$URL"; then
              echo "Downloaded successfully with aria2c"
            else
              echo "aria2c failed, falling back to curl / wget..."
              cd ./downloads
              curl -L -O -J "$URL" || wget -c "$URL"
              cd ..
            fi
          fi

      - name: Upload to Google Drive / Google Photos and Generate Public Link
        id: cloud_upload
        run: |
          DEST="${{ github.event.inputs.destination }}"
          if [ -z "$DEST" ]; then
            DEST="gdrive"
          fi

          TARGET_FOLDER="${{ github.event.inputs.folder }}"
          if [ -z "$TARGET_FOLDER" ]; then
            TARGET_FOLDER="Remote_Uploads"
          fi

          echo "Selected Destination: $DEST"
          echo "Target Folder / Album: $TARGET_FOLDER"

          ITEM_NAME=$(ls -1 ./downloads | head -n 1)
          if [ -z "$ITEM_NAME" ]; then
            echo "Error: No files downloaded!"
            exit 1
          fi

          echo "Processing item: $ITEM_NAME"

          if [ "$DEST" = "gphotos" ]; then
            echo "Uploading directly to Google Photos Album: $TARGET_FOLDER"
            rclone copy "./downloads" "gphotos:album/$TARGET_FOLDER" -P || rclone copy "./downloads" "gphotos:upload" -P
            SHARE_LINK="https://photos.google.com/"
            DIRECT_LINK="https://photos.google.com/"
          else
            echo "Uploading to Google Drive Folder: $TARGET_FOLDER"
            rclone copy "./downloads" "gdrive:$TARGET_FOLDER" --drive-chunk-size 64M -P
            SHARE_LINK=$(rclone link "gdrive:$TARGET_FOLDER/$ITEM_NAME")
            if [ -z "$SHARE_LINK" ]; then
              SHARE_LINK=$(rclone link "gdrive:$TARGET_FOLDER")
            fi
            
            FILE_ID=$(echo "$SHARE_LINK" | sed -n 's/.*id=\([^&]*\).*/\1/p')
            if [ -z "$FILE_ID" ]; then
              FILE_ID=$(echo "$SHARE_LINK" | sed -n 's/.*\/d\/\([^/]*\).*/\1/p')
            fi
            
            if [ ! -z "$FILE_ID" ]; then
              DIRECT_LINK="https://drive.google.com/uc?id=$FILE_ID&export=download"
            else
              DIRECT_LINK="$SHARE_LINK"
            fi
          fi

          echo "PUBLIC_LINK=$SHARE_LINK"

          # GitHub Job Summary
          echo "## 🚀 Upload Completed Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "- **📁 Name:** \`$ITEM_NAME\`" >> $GITHUB_STEP_SUMMARY
          echo "- **🎯 Destination:** \`$DEST\`" >> $GITHUB_STEP_SUMMARY
          echo "- **📂 Target:** \`$TARGET_FOLDER\`" >> $GITHUB_STEP_SUMMARY
          echo "- **🔗 Link:** [$SHARE_LINK]($SHARE_LINK)" >> $GITHUB_STEP_SUMMARY

          # Publish to result.json in repo
          cat <<EOF > result.json
          {
            "status": "success",
            "destination": "$DEST",
            "filename": "$ITEM_NAME",
            "folder": "$TARGET_FOLDER",
            "share_link": "$SHARE_LINK",
            "direct_link": "$DIRECT_LINK",
            "timestamp": "$(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          }
          EOF

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add result.json
          git commit -m "Update upload result: $ITEM_NAME [skip ci]" || true
          git push origin main || true
